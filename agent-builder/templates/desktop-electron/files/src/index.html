<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__APP_TITLE__</title>
  <meta name="description" content="__APP_DESCRIPTION__">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>__APP_TITLE__</h1>
      <p class="subtitle">__APP_DESCRIPTION__</p>
    </header>

    <form id="add-form" class="add-form" autocomplete="off">
      <input id="new-item" type="text" placeholder="Add an item…" aria-label="New item" required>
      <button type="submit">Add</button>
    </form>

    <nav class="filters" aria-label="Filter items">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="open">Open</button>
      <button type="button" data-filter="done">Done</button>
    </nav>

    <ul id="item-list" class="item-list"></ul>

    <footer>
      <span id="counter">0 items</span>
      <span>
        <button type="button" id="export" class="link">Export…</button>
        <button type="button" id="clear-done" class="link">Clear completed</button>
      </span>
    </footer>
  </main>
  <p id="about" class="about"></p>
  <script src="renderer.js"></script>
</body>
</html>
