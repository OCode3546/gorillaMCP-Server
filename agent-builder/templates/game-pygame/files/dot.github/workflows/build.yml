name: Build executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Smoke test
        run: python main.py --smoke-test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - name: Package (Windows / Linux)
        if: runner.os != 'macOS'
        run: python -m PyInstaller --noconfirm --onefile --windowed --name __APP_NAME__ main.py
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: python -m PyInstaller --noconfirm --windowed --name __APP_NAME__ main.py
      - uses: actions/upload-artifact@v4
        with:
          name: __APP_NAME__-${{ runner.os }}
          path: dist/
